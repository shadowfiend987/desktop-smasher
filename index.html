<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desktop Smasher</title>
<meta name="description" content="Turn any image into smashable tiles. Images stay in your browser — nothing is uploaded.">
<meta name="theme-color" content="#0d0f17">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Desktop Smasher</h1>
      <p class="sub">Today, it’s okay to fall apart a little.</p>
    </div>
  </header>

  <main class="stage-wrap">
    <div id="stage" class="stage" aria-label="Smashable image stage — click or tap to smash">
      <canvas id="canvas"></canvas>
      <div id="dropHint" class="drop-hint" hidden>Drop to import image</div>
    </div>
  </main>

  <nav class="toolbar" aria-label="Controls">
    <label class="btn" title="Choose a JPG / PNG / WebP image, or drag one onto the stage">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3M12 4v11M7 9l5-5 5 5"/></svg>
      <span>Import</span>
      <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    </label>
    <button id="btnSmash" class="btn accent" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.3L20 6l-3.3 5.3L22 14l-6.4.8L16 21l-4-4.6L8 21l.4-6.2L2 14l5.3-2.7L4 6l5.8 2.3z"/></svg>
      <span>Smash All</span>
    </button>
    <button id="btnRewind" class="btn" type="button" title="Hold to rewind; release to continue">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 8v4l3 2"/></svg>
      <span>Rewind</span>
    </button>
    <button id="btnReset" class="btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>
      <span>Reset</span>
    </button>
    <button id="btnExport" class="btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
      <span>Export PNG</span>
    </button>
  </nav>

  <footer class="hint" id="hint">
    Click to smash · Drag for a gust of wind · Hold Rewind to play the real path backward (up to ~10 s / 600 frames) · Images stay on this device — nothing is uploaded
  </footer>
</div>
<script src="js/sample.js"></script>
<script src="js/app.js"></script>
</body>
</html>
