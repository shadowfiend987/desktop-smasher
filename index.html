<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>桌面破坏王 · Desktop Smasher</title>
<meta name="description" content="把图片变成可以打碎的方块。图片只在浏览器内处理，不上传。">
<meta name="theme-color" content="#0d0f17">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>桌面破坏王</h1>
      <p class="sub">今天，允许自己碎一下。</p>
    </div>
  </header>

  <main class="stage-wrap">
    <div id="stage" class="stage" aria-label="可打碎的图片舞台，点击或触摸打碎">
      <canvas id="canvas"></canvas>
      <div id="dropHint" class="drop-hint" hidden>松手即可导入图片</div>
    </div>
  </main>

  <nav class="toolbar" aria-label="操作">
    <label class="btn" title="选择 JPG / PNG / WebP 图片，或直接拖入舞台">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3M12 4v11M7 9l5-5 5 5"/></svg>
      <span>导入图片</span>
      <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    </label>
    <button id="btnSmash" class="btn accent" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.3L20 6l-3.3 5.3L22 14l-6.4.8L16 21l-4-4.6L8 21l.4-6.2L2 14l5.3-2.7L4 6l5.8 2.3z"/></svg>
      <span>全部粉碎</span>
    </button>
    <button id="btnRewind" class="btn" type="button" title="按住倒放，松开继续">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 8v4l3 2"/></svg>
      <span>后悔药</span>
    </button>
    <button id="btnReset" class="btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>
      <span>重置</span>
    </button>
    <button id="btnExport" class="btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
      <span>导出 PNG</span>
    </button>
  </nav>

  <footer class="hint" id="hint">
    点击打碎局部 · 拖动掀起一阵风 · 按住「后悔药」沿真实轨迹倒放（最多约 10 秒 / 600 帧） · 图片只在本机浏览器处理，不上传
  </footer>
</div>
<script src="js/sample.js"></script>
<script src="js/app.js"></script>
</body>
</html>
